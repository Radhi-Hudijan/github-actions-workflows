name: test-workflow
on: 
 workflow_dispatch:
 push:
    branches: 
    - main
 pull_request:
    branches: 
    - main
 schedule:
    - cron: '0 5 * * 1-5' # Runs every day at midnight

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: use node.js latest
              uses: actions/setup-node@v3
              with:
                node-version: latest
            
            - name: Install dependencies
              run: npm ci
            
            - name: Run tests
              run : npm test

            - name: Print message
              run: echo "Tests completed successfully!"