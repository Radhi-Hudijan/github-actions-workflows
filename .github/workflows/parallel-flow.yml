name: parallel-workflow
on:
  push:
    branches:
      - main

jobs:
     build-and-test-1:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: use node.js latest
              uses: actions/setup-node@v3
              with:
                node-version: latest
            
            - name: Print message for main branch
              if: github.ref == 'refs/heads/main'
              run: echo "This is the main branch. Running tests..."

            - name: Print message for other branches
              if: github.ref != 'refs/heads/main'
              run: echo "This is not the main branch. Running tests..."
            
            - name: Run tests
              run : echo "Running tests for build-and-test-1..."

            - name: Debug message
              if: env.DEBUG == 'true'
              run: echo "Debug mode is enabled."
     
     build-and-test-2:
         runs-on: ubuntu-latest

         steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: use node.js latest
              uses: actions/setup-node@v3
              with:
                node-version: latest
            
            - name: Print message for main branch
              if: github.ref == 'refs/heads/main'
              run: echo "This is the main branch. Running tests..."

            - name: Print message for other branches
              if: github.ref != 'refs/heads/main'
              run: echo "This is not the main branch. Running tests..."
            
            - name: Run tests
              run : echo "Running a different set of tests..."

            - name: Debug message
              if: env.DEBUG == 'true'
              run: echo "Debug mode is enabled."
     

     post-build:
        runs-on: ubuntu-latest
        needs: [build-and-test-1, build-and-test-2]

        steps:
            - name: Publish test results
              uses: actions/upload-artifact@v3
              with:
                name: test-results  
                path: test-results.xml          